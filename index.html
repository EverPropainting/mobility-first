<body><header><div class="brand"><span class="mark">M</span><div>Mobility First<small>YOUR MORNING PRACTICE</small></div></div><button id="backup" class="icon-button">Backup</button></header><main id="app"></main><nav aria-label="Main navigation"><button data-view="today" class="active">Today</button><button data-view="daily">Daily</button><button data-view="plan">Routine</button><button data-view="progress">Progress</button></nav><div id="toast" role="status" aria-live="polite"></div><dialog id="modal"><div id="modal-content"></div><button id="close-modal" class="secondary">Close</button></dialog><script>
(function(root){
 'use strict';
 const DAY=['A','B','C'];
 const variants={
  squat:{name:'Goblet squat',equipment:'Dumbbell or kettlebell',unit:'lb total',kind:'reps',range:[8,12],step:5,cue:'Keep your feet steady. Lower into a comfortable range, then stand smoothly.'},
  row2:{name:'B52 two-arm cable row',equipment:'B52 · two cables',unit:'lb on each stack',cable:true,kind:'reps',range:[10,12],step:5,cue:'Set both stacks equally. Row without rocking your lower back; let your shoulder blades move naturally.'},

  openbook:{name:'Open-book rotation',equipment:'Floor',unit:'Bodyweight',body:true,side:true,kind:'reps',range:[5,8],cue:'Lie on your side with bent knees stacked. Turn your chest and arm gently; do not force the shoulder to the floor.'},
  hinge:{name:'Dumbbell Romanian deadlift',equipment:'Dumbbells',unit:'lb per dumbbell',kind:'reps',range:[8,12],step:5,cue:'Soften your knees and send your hips back. Stop before your back rounds or symptoms increase.'},

  lat2:{name:'B52 two-arm lat pulldown',equipment:'B52 · pulldown station',unit:'lb on selected stack',cable:true,kind:'reps',range:[8,12],step:5,cue:'Sit securely with overhead clearance. Pull in front of you without leaning far back. Record the stack setting, not estimated hand resistance.'},
  lat1:{name:'B52 single-arm pulldown',equipment:'B52 · one cable',unit:'lb on working stack',cable:true,side:true,kind:'reps',range:[8,10],step:5,cue:'Use a seated or kneeling position with clearance. Work both sides without arching your lower back.'},
  bird:{name:'Bird dog',equipment:'Floor',unit:'Bodyweight',body:true,side:true,kind:'reps',range:[5,8],cue:'From hands and knees, extend opposite arm and leg without arching your back. Hold each repetition for three seconds.'},
  lateral:{name:'Supported lateral lunge',equipment:'Rack support · optional dumbbell',unit:'lb total',side:true,kind:'reps',range:[6,10],step:5,cue:'Begin shallow and unweighted. Shift into one hip while keeping the other leg relatively straight.'},
  overhead1:{name:'Half-kneeling one-arm press',equipment:'Dumbbell · padded knee',unit:'lb on working arm',side:true,kind:'reps',range:[8,12],step:5,cue:'Check ceiling clearance. Keep ribs stacked over your pelvis. Change to an incline press if your shoulder is irritated.'},

  bandrotate:{name:'Standing band rotation',equipment:'Light resistance band',unit:'Band',band:true,side:true,kind:'reps',range:[6,10],cue:'Use light tension and a steady pace. Let your feet and hips turn with your chest.'},
  calf:{name:'Supported two-leg calf raise',equipment:'Rack support · optional load',unit:'lb total',kind:'reps',range:[10,12],step:5,cue:'Begin on level ground with bodyweight. Lift both heels, then lower slowly. No painful ankle rolling.'},
  bandankle:{name:'Band-resisted foot movement outward',equipment:'Light band · seated',unit:'Band',band:true,side:true,kind:'reps',range:[10,12],cue:'Work both ankles. Move the foot outward gently without turning the whole leg. Right ankle tolerance guides its resistance.'},
  seatedcalf:{name:'Seated bent-knee calf raise',equipment:'Bench · optional dumbbells',unit:'lb per thigh',kind:'reps',range:[12,15],step:5,cue:'Start unweighted. Lift and slowly lower both heels. Add a light dumbbell on each thigh only when comfortable.'}
 };
 const sessions={
  A:{title:'Squat, pull & rotation',slots:[['Squat','squat'],['Row','row2','row1','rowdb'],['Lunge','lunge'],['Rotate gently','openbook'],['Ankle finish','calf']]},
  B:{title:'Hinge, push & balance',slots:[['Hinge','hinge'],['Press','press2'],['Balance','balance'],['Pull or trunk control','lat2','lat1','bird'],['Ankle finish','bandankle']]},
  C:{title:'Sideways, shoulders & rotation',slots:[['Move sideways','lateral'],['Press','overhead1','overhead2','press2'],['Shoulders & upper back','face'],['Rotate with control','rotate','bandrotate'],['Ankle finish','seatedcalf']]}
 };
 function localDate(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}
 function lastLogs(history,id){return history.flatMap(s=>(s.logs||[]).map(l=>({...l,date:s.date}))).filter(l=>l.variant===id && l.sets && l.sets.length);}
 function suggest(history,id){
  const v=variants[id], logs=lastLogs(history,id), last=logs.at(-1);
  if(!last)return {load:0,addon:0,target:v.range[0],increase:false,reason:v.body?'Start at the lower target and stay controlled.':'Choose a light starting resistance. This is a baseline, not a prescribed weight.'};
  const first=last.sets[0];
  const result={load:first.load||0,addon:first.addon||0,target:first.reps||v.range[0],band:last.band||'Light',increase:false,reason:'Repeat your last setting and aim for smooth, comfortable movement.'};
  if(last.pain){result.reason='Symptoms were flagged. No increase suggested; reduce or change the movement if it still bothers you.';result.target=v.range[0];return result;}
  if(last.effort==='hard'){result.reason='Last time felt too hard. Repeat only if comfortable, or lower the resistance.';result.target=v.range[0];return result;}
  const qualifies=l=>!l.pain && ['easy','right'].includes(l.effort) && l.sets.length >= (l.finish?1:2) && l.sets.every(s=>s.reps>=v.range[1]) && l.sets.every(s=>s.load===l.sets[0].load && s.addon===l.sets[0].addon);
  const previous=logs.at(-2);
  if(previous && qualifies(last) && qualifies(previous) && previous.sets[0].load===first.load && previous.sets[0].addon===first.addon){
   if(v.body||v.band){result.reason='Two comfortable sessions at the upper target. Keep the dose; focus on control or slightly less support.';}
   else {const change=Number(last.increment)||v.step;const base=Number(first.load)||0;const add=Number(first.addon)||0;const total=base+add;const cap=id.includes('db')||['hinge','press2','overhead1','overhead2'].includes(id)?50:Infinity;
    if(total===0 || change/total>.15 || total+change>cap){result.reason='You reached the target twice. A full weight jump is large or exceeds your dumbbells; keep this load or use a smaller available increment.';}
    else{result.load=base;result.addon=add; if(v.cable && base+change>170)result.addon+=change;else result.load+=change;result.target=v.range[0];result.increase=true;result.reason=`Two comfortable sessions at the upper target. Optional +${change} lb in the same weight convention; confirm the increment is available.`;}
   }
  } else if(first.reps<v.range[1] && last.sets.every(s=>s.reps>=first.reps)){result.target=Math.min(v.range[1],first.reps+1);result.reason='Keep the resistance. Try one more controlled repetition if it feels comfortable.';}
  return result;
 }
 function nextLetter(letter){return DAY[(DAY.indexOf(letter)+1)%3];}
 function blank(){return {version:1,next:'A',history:[],draft:null,choices:{},daily:{},sleep:[],sleepActive:null};}
 function sleepEntry(start,end,id=String(Date.now())){
  const a=new Date(start),b=new Date(end),hours=(b-a)/3600000;
  if(!Number.isFinite(hours)||hours<=0||hours>24)throw Error('Wake time must be after bedtime and within 24 hours.');
  return {id,date:localDate(b),start:a.toISOString(),end:b.toISOString(),hours};
 }
 function dateInput(value){const d=new Date(value);return `${localDate(d)}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
 function validate(data){
  if(!data||data.version!==1||!DAY.includes(data.next)||!Array.isArray(data.history)||data.history.length>20000)throw Error('This is not a valid Mobility First backup.');
  for(const s of data.history){if(!DAY.includes(s.letter)||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||!Array.isArray(s.logs)||s.logs.length>5)throw Error('Invalid session in backup.');for(const score of [s.before,s.after])if(score!=null&&(!Number.isFinite(score)||score<0||score>10))throw Error('Invalid stiffness score.');for(const l of s.logs){if(!variants[l.variant]||!Array.isArray(l.sets)||!l.sets.length||l.sets.length>3||!['easy','right','hard'].includes(l.effort))throw Error('Invalid exercise in backup.');for(const set of l.sets)if(![set.load,set.addon,set.reps].every(n=>Number.isFinite(n)&&n>=0&&n<=2000)||set.reps>999)throw Error('Invalid set in backup.');}}
  for(const [key,id] of Object.entries(data.choices||{})){const letter=key[0],index=Number(key.slice(1));if(!DAY.includes(letter)||!Number.isInteger(index)||!sessions[letter].slots[index]?.slice(1).includes(id))throw Error('Invalid exercise choice in backup.');}
  if(data.daily!=null&&(typeof data.daily!=='object'||Array.isArray(data.daily)))throw Error('Invalid daily records.');
  for(const [date,entry] of Object.entries(data.daily||{})){
   if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!entry||entry.weight!=null&&(!Number.isFinite(entry.weight)||entry.weight<=0||entry.weight>1500)||entry.feel!=null&&(!Number.isInteger(entry.feel)||entry.feel<1||entry.feel>5)||!Array.isArray(entry.reasons)||entry.reasons.some(r=>!['Tired','Sick','Sore'].includes(r)))throw Error('Invalid daily check-in.');
  }
  if(data.sleep!=null&&!Array.isArray(data.sleep))throw Error('Invalid sleep records.');
  const sleepIds=new Set();
  for(const s of data.sleep||[]){const calculated=sleepEntry(s.start,s.end,s.id);if(typeof s.id!=='string'||sleepIds.has(s.id)||!Number.isFinite(s.hours)||calculated.date!==s.date||Math.abs(calculated.hours-s.hours)>.0001)throw Error('Invalid sleep entry.');sleepIds.add(s.id);}
  if(data.sleepActive!=null&&(!data.sleepActive.start||!Number.isFinite(new Date(data.sleepActive.start).getTime())))throw Error('Invalid active sleep timer.');
  return {...blank(),...data,draft:null,choices:data.choices&&typeof data.choices==='object'?data.choices:{}};
 }
 const api={DAY,variants,sessions,localDate,lastLogs,suggest,nextLetter,blank,validate,sleepEntry,dateInput};
 if(typeof module!=='undefined')module.exports=api;root.Mobility=api;
})(typeof globalThis!=='undefined'?globalThis:window);

</script>
<script>
'use strict';
function sleepDuration(hours){const minutes=Math.round(hours*60);return `${Math.floor(minutes/60)}h ${String(minutes%60).padStart(2,'0')}m`;}
function dailyCard(date=M.localDate()){
 const entry=state.daily[date]||{weight:null,feel:null,reasons:[]};
 return `<section class="card"><h2>Daily check-in</h2><p class="muted">How are you feeling before your workout? 1 is low; 5 is your best.</p><label for="daily-weight">Bodyweight · lb</label><input id="daily-weight" type="number" min="1" max="1500" step="0.1" inputmode="decimal" placeholder="Optional" value="${entry.weight??''}"><label>How I feel · 1–5</label><div class="feel-score seg" role="group" aria-label="Daily feeling score">${[1,2,3,4,5].map(n=>`<button type="button" data-feel="${n}" aria-pressed="${entry.feel===n}" class="${entry.feel===n?'selected':''}">${n}</button>`).join('')}</div><p><small>What’s affecting how you feel? Choose any that apply.</small></p><div class="grid3 seg">${['Tired','Sick','Sore'].map(r=>`<button type="button" data-reason="${r}" aria-pressed="${entry.reasons.includes(r)}" class="${entry.reasons.includes(r)?'selected':''}">${r}</button>`).join('')}</div><button class="primary finish" id="save-daily" ${loadProblem?'disabled':''}>Save check-in</button><small id="daily-saved">${state.daily[date]?'Saved for '+date+'. Saving again updates this day.':'Optional · you can log this on rest days, too.'}</small></section>`;
}
function bindDaily(date=M.localDate()){
 $('#save-daily').onclick=()=>{
  const raw=$('#daily-weight').value,weight=raw===''?null:Number(raw);
  if(weight!==null&&(!Number.isFinite(weight)||weight<=0||weight>1500))return toast('Enter a valid bodyweight in pounds.');
  const selected=app.querySelector('[data-feel][aria-pressed="true"]');
  const reasons=[...app.querySelectorAll('[data-reason][aria-pressed="true"]')].map(b=>b.dataset.reason);
  const entry={weight,feel:selected?Number(selected.dataset.feel):null,reasons};
  if(weight===null&&entry.feel===null&&!reasons.length)return toast('Enter your weight, a feeling score, or a reason.');
  const old=state.daily[date];state.daily[date]=entry;
  if(!persist()){if(old)state.daily[date]=old;else delete state.daily[date];return;}
  $('#daily-saved').textContent='Saved for '+date+'. Saving again updates this day.';toast('Daily check-in saved');
 };
 app.querySelectorAll('[data-feel]').forEach(button=>button.onclick=()=>{const was=button.getAttribute('aria-pressed')==='true';app.querySelectorAll('[data-feel]').forEach(b=>{const on=b===button&&!was;b.setAttribute('aria-pressed',String(on));b.classList.toggle('selected',on);});});
 app.querySelectorAll('[data-reason]').forEach(button=>button.onclick=()=>{const on=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(on));button.classList.toggle('selected',on);});
}
function sleepCard(){
 const active=state.sleepActive,last=state.sleep.at(-1);
 return `<section class="card"><h2>Sleep</h2>${active?`<p>Started ${escape(new Date(active.start).toLocaleString())}</p><div class="metric" id="sleep-elapsed">${sleepDuration(Math.max(0,(Date.now()-new Date(active.start))/3600000))}</div><small>Elapsed time since bedtime · stays running when you close the app.</small><button id="end-sleep" class="primary finish">End sleep & review times</button><button id="edit-bedtime" class="plain">Edit bedtime</button>`:`${last?`<div class="row"><div><strong>${last.date}</strong><div class="metric">${sleepDuration(last.hours)}</div></div><button id="edit-last-sleep" class="secondary">Edit times</button></div>`:'<p class="muted">Tap at bedtime, then end it when you wake up. You can correct both times before saving.</p>'}<button id="start-sleep" class="primary finish" ${loadProblem?'disabled':''}>Start sleep</button>`}<button class="plain" id="manual-sleep">Add a night manually</button><small>Measures time between your entered bedtime and wake time; it cannot detect sleep or nighttime awakenings.</small></section>`;
}
function bindSleep(){
 if($('#start-sleep'))$('#start-sleep').onclick=()=>{const previous=state.sleepActive;state.sleepActive={start:new Date().toISOString()};if(!persist()){state.sleepActive=previous;return;}render();toast('Sleep timer started');};
 if($('#end-sleep'))$('#end-sleep').onclick=()=>sleepEditor('end');
 if($('#edit-bedtime'))$('#edit-bedtime').onclick=()=>sleepEditor('active');
 if($('#edit-last-sleep'))$('#edit-last-sleep').onclick=()=>sleepEditor('edit',state.sleep.at(-1).id);
 $('#manual-sleep').onclick=()=>sleepEditor('manual');
}
function sleepEditor(mode,id){
 const existing=id?state.sleep.find(s=>s.id===id):null,now=new Date(),bed=new Date(now);
 bed.setDate(bed.getDate()-1);bed.setHours(21,30,0,0);
 const start=existing?.start||(['end','active'].includes(mode)?state.sleepActive?.start:null)||bed.toISOString(),end=existing?.end||now.toISOString();
 modal(`<h2>${mode==='active'?'Edit bedtime':mode==='edit'?'Edit sleep times':'Review your sleep'}</h2><p class="muted">Forgot to stop the timer? Enter when you actually woke up.</p><label for="sleep-start">Bedtime</label><input id="sleep-start" type="datetime-local" value="${M.dateInput(start)}">${mode==='active'?'':`<label for="sleep-end">Wake time</label><input id="sleep-end" type="datetime-local" value="${M.dateInput(end)}">`}<p id="sleep-calculated" class="suggestion" aria-live="polite"></p><button id="save-sleep" class="primary">Save ${mode==='active'?'bedtime':'sleep'}</button>`);
 const preview=()=>{try{const stop=$('#sleep-end')?.value||new Date().toISOString();$('#sleep-calculated').textContent=sleepDuration(M.sleepEntry($('#sleep-start').value,stop).hours);}catch(error){$('#sleep-calculated').textContent=error.message;}};
 $('#sleep-start').oninput=preview;if($('#sleep-end'))$('#sleep-end').oninput=preview;preview();
 $('#save-sleep').onclick=()=>{
  try{
   const startValue=$('#sleep-start').value,endValue=$('#sleep-end')?.value;
   if(!startValue||mode!=='active'&&!endValue)throw Error('Enter both bedtime and wake time.');

   const oldActive=state.sleepActive,oldSleep=state.sleep;
   if(mode==='active')state.sleepActive={start:new Date(startValue).toISOString()};
   else {const entry=M.sleepEntry(startValue,endValue,id||String(Date.now()));state.sleep=state.sleep.filter(s=>s.id!==entry.id).concat(entry).sort((a,b)=>new Date(a.end)-new Date(b.end));if(mode==='end')state.sleepActive=null;}
   if(!persist()){state.sleepActive=oldActive;state.sleep=oldSleep;return;}
   $('#modal').close();render();toast(mode==='active'?'Bedtime updated':'Sleep saved');
  }catch(error){toast(error.message);}
 };
}
let dailyDate;
function renderDaily(){
 const date=dailyDate||M.localDate();
 const records=Object.entries(state.daily).sort(([a],[b])=>b.localeCompare(a)).slice(0,14);
 app.innerHTML=`<span class="eyebrow">Rest days count, too</span><h1>Your daily picture.</h1><label for="checkin-date">Check-in date</label><input id="checkin-date" type="date" max="${M.localDate()}" value="${date}">${dailyCard(date)}${sleepCard()}<section class="card"><h2>Recent check-ins</h2>${records.length?records.map(([day,e])=>`<div class="record row"><div><strong>${day}</strong><br><small>${e.weight==null?'Weight —':e.weight+' lb'} · Feeling ${e.feel??'—'}/5${e.reasons.length?'<br>'+e.reasons.map(escape).join(', '):''}</small></div><button class="secondary" data-checkin-edit="${day}">Edit</button></div>`).join(''):'<p class="muted">Your daily records will appear here.</p>'}</section><section class="card"><h2>Sleep history</h2>${state.sleep.length?state.sleep.slice(-14).reverse().map(s=>`<div class="record"><div class="row"><strong>${s.date} · ${sleepDuration(s.hours)}</strong><button class="secondary" data-sleep-edit="${escape(s.id)}">Edit</button></div><small>${escape(new Date(s.start).toLocaleString())} → ${escape(new Date(s.end).toLocaleString())}</small></div>`).join(''):'<p class="muted">Your recorded nights will appear here.</p>'}</section>`;
 bindDaily(date);bindSleep();
 $('#checkin-date').onchange=e=>{if(!e.target.value||e.target.value>M.localDate())return toast('Choose today or an earlier date.');dailyDate=e.target.value;renderDaily();};
 app.querySelectorAll('[data-checkin-edit]').forEach(b=>b.onclick=()=>{dailyDate=b.dataset.checkinEdit;renderDaily();window.scrollTo(0,0);});

}
function sparkline(records,label,unit){
 const vals=records.map(r=>r.value),low=Math.min(...vals),high=Math.max(...vals);
 const points=vals.map((v,i)=>`${16+(i*(288/(vals.length-1||1)))},${high===low?60:104-(v-low)/(high-low)*88}`).join(' ');
 return `<svg viewBox="0 0 320 120" class="sparkline" role="img" aria-label="${escape(label)}"><polyline points="${points}" fill="none" stroke="currentColor" stroke-width="3"/>${points.split(' ').map(p=>{const [x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="4" fill="currentColor"/>`;}).join('')}</svg><div class="row"><small>${records[0].date}</small><small>${records.at(-1).date}</small></div><details><summary>Recorded values</summary>${records.map(r=>`<p>${r.date} · ${r.value.toFixed(1)} ${unit}</p>`).join('')}</details>`;
}
function wellnessProgress(){
 const daily=Object.entries(state.daily).sort(([a],[b])=>a.localeCompare(b));
 const weights=daily.filter(([,e])=>e.weight!=null).slice(-14).map(([date,e])=>({date,value:e.weight}));

 return `<section class="card"><h2>Bodyweight</h2>${weights.length?`<p>Latest: <strong>${weights.at(-1).value} lb</strong> · average of last ${Math.min(7,weights.length)} entries: ${average(weights.slice(-7)).toFixed(1)} lb</p>${sparkline(weights,'Bodyweight over recorded days','lb')}`:'<p class="muted">Log your weight in Today or Daily to see a trend.</p>'}</section><section class="card"><h2>Sleep trend</h2>${nights.length?`<p>Average of last ${Math.min(7,nights.length)} recorded nights: <strong>${sleepDuration(average(nights.slice(-7)))}</strong></p>${sparkline(nights,'Hours between bedtime and wake time','hours')}`:'<p class="muted">Start the sleep timer or add a night manually.</p>'}<small>Based on your entered times, not measured sleep. Missing nights are not counted as zero.</small></section><section class="card"><h2>How you felt</h2>${feel.length?feel.slice().reverse().map(([date,e])=>`<p><strong>${date} · ${e.feel}/5</strong>${e.reasons.length?' · '+e.reasons.map(escape).join(', '):''}</p>`).join(''):'<p class="muted">Save a 1–5 feeling score and any reasons before your workout.</p>'}</section>`;
}



</script>
<script>
'use strict';
const M=window.Mobility, KEY='mobility_first_v2', $=s=>document.querySelector(s), app=$('#app');
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=M.blank(),view='today',editing=null,form=null,loadProblem=false;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);M.validate(parsed);state={...M.blank(),...parsed};}}catch(e){loadProblem=true;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(e){toast('Could not save. Keep this page open and export a backup.');return false;}}
function toast(message){const el=$('#toast');el.textContent=message;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',4500);}
function modal(html){$('#modal-content').innerHTML=html;$('#modal').showModal();}
$('#close-modal').onclick=()=>$('#modal').close();

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>move(b.dataset.view));
function chosen(letter,index){return state.choices[letter+index]||M.sessions[letter].slots[index][1];}
function slots(letter){return M.sessions[letter].slots.map((s,i)=>({name:s[0],variant:chosen(letter,i),index:i}));}
function choiceOptions(letter,index,current){return M.sessions[letter].slots[index].slice(1).map(id=>`<option value="${id}" ${id===current?'selected':''}>${M.variants[id].name}</option>`).join('');}
function draftLog(i){return state.draft?.logs.find(l=>l.slot===i);}
function elapsed(){return state.draft?Math.max(0,Math.floor((Date.now()-state.draft.started)/60000)):0;}
function thisWeek(){const now=new Date(),monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));const start=M.localDate(monday);return state.history.filter(s=>s.date>=start&&s.date<=M.localDate(now));}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(editing!==null)return renderExercise();({today:renderToday,daily:renderDaily,plan:renderPlan,progress:renderProgress}[view])();}
function renderToday(){
 const d=state.draft,letter=d?.letter||state.next,session=M.sessions[letter];
 const done=d?.logs.length||0;
 app.innerHTML=`<div class="row"><span class="eyebrow">${escape(new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}))}</span><span class="pill">${thisWeek().length} / 5 this week</span></div>
 <h1>${d?'Pick up where you left off.':'Your next session.'}</h1>
 ${loadProblem?'<p class="notice">Saved data could not be read. Export it from Backup before starting a new record.</p>':''}
 ${dailyCard()}${sleepCard()}
 <div class="card session"><div class="row"><div><span class="eyebrow">Continuous A / B / C</span><h2 style="margin-top:8px">${session.title}</h2><small>20 min Peloton · 25–30 min movement</small></div><span class="letter">${letter}</span></div>
 ${d?`<progress value="${done}" max="5" aria-label="Exercise logging progress"></progress><div class="row"><small>${done} / 5 exercises logged</small><small id="elapsed">${elapsed()} min since starting</small></div>`:''}
 <ul class="exercise-list">${slots(letter).map(s=>{const l=draftLog(s.index);return `<li><span class="number ${l?'completed':''}">${l?'✓':s.index+1}</span><div><strong>${escape(M.variants[l?.variant||s.variant].name)}</strong><br><small>${s.index===4?'1 finishing set':'2 sets'}${M.variants[l?.variant||s.variant].side?' · both sides':''}</small></div>${d?`<button class="secondary" data-edit="${s.index}">${l?'Edit':'Log'}</button>`:''}</li>`;}).join('')}</ul>
 ${d?`<button class="primary" id="continue">${done===5?'Review & finish':'Continue workout'}</button><button class="plain" id="finish-early">Finish a shortened session</button><button class="plain" id="discard">Discard this session</button>`:`<label for="peloton">Today’s Peloton warm-up</label><select id="peloton"><option>20-minute ride</option><option>20-minute yoga</option></select><small>Enter your class choice here; Peloton recommendations aren’t connected yet.</small><label for="before">Stiffness before · 0 loose, 10 very stiff</label><input id="before" type="number" min="0" max="10" inputmode="numeric" placeholder="Optional"><button class="primary" id="start" style="margin-top:16px" ${loadProblem?'disabled':''}>Start session ${letter}</button>`}</div>
 <p class="muted">Aim to finish by 5:58 am. Keep the movements controlled; missed days never reset your rotation.</p>
 <details><summary>Three-minute preparation</summary><p>After Peloton: five seated ankle circles each direction on both sides, six comfortable supported ankle rocks per side, then five easy repetitions of the first lift.</p><a href="https://gmb.io/feet/" target="_blank" rel="noopener">Your GMB ankle reference</a></details>
 <details><summary>Training guidance</summary><p>Start light and leave about three comfortable repetitions in reserve. Use a comfortable range and slow lowering. Stop or change movements that cause sharp pain or ankle giving-way. Persistent or worsening ankle/back symptoms warrant a clinician’s assessment.</p><p>Record both sides; the right ankle can use less resistance. For bilateral work, the weaker side guides the load.</p><a href="https://www.orthoinfo.org/recovery/foot-and-ankle-conditioning-program/" target="_blank" rel="noopener">AAOS ankle conditioning guidance</a></details>`;
 app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openExercise(+b.dataset.edit));
 bindDaily();bindSleep();
 if(d){$('#continue').onclick=()=>done===5?finishDialog():openExercise(slots(letter).find(s=>!draftLog(s.index)).index);$('#finish-early').onclick=()=>finishDialog(true);$('#discard').onclick=()=>{if(confirm('Discard this unfinished session? Your completed history stays saved.')){state.draft=null;persist();render();}};}
 else $('#start').onclick=()=>{const before=$('#before').value;if(before!==''&&(!Number.isFinite(+before)||+before<0||+before>10))return toast('Choose stiffness from 0 to 10.');const checkin=state.daily[M.localDate()];state.draft={letter,date:M.localDate(),started:Date.now(),peloton:$('#peloton').value,before:before===''?null:+before,checkin:checkin?JSON.parse(JSON.stringify(checkin)):null,logs:[],partial:{}};if(persist())openExercise(0);};
}
function openExercise(index){
 const d=state.draft;if(!d)return;
 const existing=draftLog(index),id=existing?.variant||chosen(d.letter,index),suggest=M.suggest(state.history,id),last=M.lastLogs(state.history,id).at(-1);
 editing=index;form=d.partial?.[index]||{variant:id,sets:existing?.sets.map(s=>({...s}))||Array.from({length:index===4?1:2},()=>({load:suggest.load,addon:suggest.addon,reps:suggest.target})),effort:existing?.effort||'',pain:existing?.pain||false,band:existing?.band||suggest.band||'Light',increment:existing?.increment||last?.increment||M.variants[id].step||5};render();window.scrollTo(0,0);
}
function cacheForm(){if(state.draft){state.draft.partial=state.draft.partial||{};state.draft.partial[editing]=JSON.parse(JSON.stringify(form));persist();}}
function stepper(i,key,value,step,label){return `<div><label for="set-${i}-${key}">${label}</label><div class="stepper"><button type="button" data-step="${i},${key},-${step}" aria-label="Decrease set ${i+1} ${label}">−</button><input id="set-${i}-${key}" data-i="${i}" data-key="${key}" type="number" min="0" max="${key==='reps'?999:2000}" step="${step}" inputmode="decimal" value="${value}"><button type="button" data-step="${i},${key},${step}" aria-label="Increase set ${i+1} ${label}">+</button></div></div>`;}
function renderExercise(){
 const d=state.draft,v=M.variants[form.variant],s=M.suggest(state.history,form.variant),last=M.lastLogs(state.history,form.variant).at(-1);
 app.innerHTML=`<button class="plain" id="back">Back to session</button><div class="row"><span class="eyebrow">Session ${d.letter} · ${editing+1} of 5</span><span class="pill">${elapsed()} min</span></div><h1>${escape(v.name)}</h1>
 <div class="card"><label for="variation">Exercise option</label><select id="variation">${choiceOptions(d.letter,editing,form.variant)}</select><p class="cue">${v.cue}</p><small>${v.equipment}${v.side?' · finish both sides; log reps per side':''}</small></div>
 <div class="card"><h2>Log once, then move on.</h2><p class="muted">${last?`Last time: ${last.sets.map(x=>`${x.load+x.addon} ${v.body?'':v.band?'': 'lb · '}${x.reps} ${v.kind==='seconds'?'sec':'reps'}`).join(' / ')}${v.side?' per side':''}`:'No history for this variation yet.'}</p><p class="suggestion">${escape(s.reason)}</p><strong>${v.unit}</strong>${v.cable?'<p class="muted">Enter the stack selector and add-on separately. This records your machine setting; it does not estimate cable resistance. For two stacks, enter the setting on each stack—not their sum.</p>':''}
 ${v.band?`<label for="band">Band resistance</label><select id="band">${['Light','Medium','Heavy'].map(x=>`<option ${x===form.band?'selected':''}>${x}</option>`).join('')}</select>`:''}
 ${form.sets.map((x,i)=>`<div class="set ${v.cable?'cable':v.body||v.band?'body':''}"><span class="setnumber">${i+1}</span>${v.body||v.band?'':stepper(i,'load',x.load,form.increment,v.cable?'Stack lb':'Weight lb')}${v.cable?stepper(i,'addon',x.addon,2.5,'Add-on lb'):''}${stepper(i,'reps',x.reps,1,v.kind==='seconds'?'Seconds':'Reps')}</div>`).join('')}
 <div class="row wrap"><button class="secondary" id="match">Apply first set to all</button><div class="inline"><button class="plain" id="less" ${form.sets.length===1?'disabled':''}>− set</button><button class="plain" id="more" ${form.sets.length===3?'disabled':''}>+ set</button></div></div>
 <label>How did it feel?</label><div class="grid3 seg">${[['easy','Easy'],['right','About right'],['hard','Too hard']].map(([key,label])=>`<button class="${form.effort===key?'selected':''}" data-effort="${key}" aria-pressed="${form.effort===key}">${label}</button>`).join('')}</div>
 <label class="check-label"><input id="pain" type="checkbox" ${form.pain?'checked':''}>Pain or instability during this exercise</label>
 <details><summary>Weight increment</summary><label for="increment">Smallest available increase in this weight convention</label><input id="increment" type="number" min="0.5" max="25" step="0.5" value="${form.increment}"><small>Suggestions use this increment after two comfortable exposures at the upper rep target. Large jumps are held.</small></details>
 <button class="primary finish" id="save-exercise">Save exercise & continue</button></div>`;
 $('#back').onclick=()=>{cacheForm();editing=null;form=null;render();};
 $('#variation').onchange=e=>{const id=e.target.value,v2=M.variants[id],s2=M.suggest(state.history,id);state.choices[d.letter+editing]=id;form={variant:id,sets:Array.from({length:editing===4?1:2},()=>({load:s2.load,addon:s2.addon,reps:s2.target})),effort:'',pain:false,band:s2.band||'Light',increment:M.lastLogs(state.history,id).at(-1)?.increment||v2.step||5};cacheForm();render();};
 app.querySelectorAll('[data-i]').forEach(input=>input.oninput=()=>{form.sets[+input.dataset.i][input.dataset.key]=input.value===''?NaN:+input.value;cacheForm();});
 app.querySelectorAll('[data-step]').forEach(button=>button.onclick=()=>{const [i,key,step]=button.dataset.step.split(',');form.sets[+i][key]=Math.max(0,(Number(form.sets[+i][key])||0)+Number(step));cacheForm();render();});
 $('#match').onclick=()=>{form.sets=form.sets.map(()=>({...form.sets[0]}));cacheForm();render();};
 $('#less').onclick=()=>{form.sets.pop();cacheForm();render();};$('#more').onclick=()=>{form.sets.push({...form.sets.at(-1)});cacheForm();render();};
 app.querySelectorAll('[data-effort]').forEach(b=>b.onclick=()=>{form.effort=b.dataset.effort;cacheForm();render();});
 $('#pain').onchange=e=>{form.pain=e.target.checked;cacheForm();};if($('#band'))$('#band').onchange=e=>{form.band=e.target.value;cacheForm();};
 $('#increment').onchange=e=>{if(+e.target.value>=.5&&+e.target.value<=25){form.increment=+e.target.value;cacheForm();}else toast('Choose an increment from 0.5 to 25 lb.');};
 $('#save-exercise').onclick=()=>{
  if(!form.effort)return toast('Choose how the exercise felt.');
  if(form.sets.some(x=>![x.load,x.addon,x.reps].every(Number.isFinite)||x.load<0||x.addon<0||x.reps<=0||x.reps>999||x.load+x.addon>2000))return toast('Check your weights and reps. Use positive reps or seconds.');
  if(v.cable && form.sets.some(x=>x.load>170))return toast('Enter up to 170 lb on the stack; record extra plates under Add-on.');
  if(v.body||v.band)form.sets.forEach(x=>{x.load=0;x.addon=0;});
  const log={...JSON.parse(JSON.stringify(form)),slot:editing,finish:editing===4};
  d.logs=d.logs.filter(l=>l.slot!==editing);d.logs.push(log);d.logs.sort((a,b)=>a.slot-b.slot);delete d.partial[editing];
  if(!persist())return;editing=null;form=null;const remaining=slots(d.letter).find(x=>!draftLog(x.index));if(remaining)openExercise(remaining.index);else{render();finishDialog();}toast('Exercise saved');
 };
}
function finishDialog(short=false){
 const d=state.draft;if(!d)return;if(!d.logs.length)return toast('Log at least one exercise before finishing.');
 modal(`<h2>${short?'Finish a shortened session':'Session '+d.letter+' complete'}</h2><p>${d.logs.length} exercises logged · ${elapsed()} minutes including your warm-up.</p><label for="after">Stiffness after · 0 loose, 10 very stiff</label><input id="after" type="number" min="0" max="10" placeholder="Optional"><label for="ankle">Right ankle after</label><select id="ankle"><option value="">Not recorded</option><option>Better</option><option>Unchanged</option><option>Worse</option></select><label for="back-response">Lower back after</label><select id="back-response"><option value="">Not recorded</option><option>Better</option><option>Unchanged</option><option>Worse</option></select><p class="muted">Next session: ${M.nextLetter(d.letter)}. A shortened session counts toward consistency.</p><button id="complete" class="primary">Save session</button>`);
 $('#complete').onclick=()=>{const a=$('#after').value;if(a!==''&&(!Number.isFinite(+a)||+a<0||+a>10))return toast('Choose stiffness from 0 to 10.');const finished={...d,date:M.localDate(),ended:Date.now(),after:a===''?null:+a,ankle:$('#ankle').value,back:$('#back-response').value,short:d.logs.length<5||d.logs.some(l=>!l.finish&&l.sets.length<2)};delete finished.partial;state.history.push(finished);state.next=M.nextLetter(d.letter);state.draft=null;if(!persist())return;$('#modal').close();editing=null;form=null;view='today';render();toast('Session saved. Next up: '+state.next);};
}
function renderPlan(){app.innerHTML=`<span class="eyebrow">A repeatable practice</span><h1>Strength with movement.</h1><p class="muted">A / B / C continuously. Two sets per main exercise, one ankle finishing set. Choose your option; its history stays separate.</p>${M.DAY.map(letter=>`<section class="card session"><div class="row"><h2>${M.sessions[letter].title}</h2><span class="letter">${letter}</span></div>${slots(letter).map(s=>`<div class="record"><label for="plan-${letter}-${s.index}">${s.name}</label><select id="plan-${letter}-${s.index}" data-letter="${letter}" data-slot="${s.index}">${choiceOptions(letter,s.index,s.variant)}</select><small>${M.variants[s.variant].range.join('–')} ${M.variants[s.variant].kind==='seconds'?'seconds':'reps'}${M.variants[s.variant].side?' per side':''} · ${s.index===4?1:2} sets</small><p>${M.variants[s.variant].cue}</p></div>`).join('')}</section>`).join('')}<div class="card"><h2>Progress at your pace</h2><p>Begin with light loads. First improve control and comfortable range, then reps, then resistance. No automatic load increases after painful or overly difficult work.</p><p>Overhead options are seated or kneeling for your ceiling. The ankle finish always works both sides.</p></div>`;app.querySelectorAll('[data-letter]').forEach(s=>s.onchange=()=>{state.choices[s.dataset.letter+s.dataset.slot]=s.value;persist();render();});}
function renderProgress(){
 const h=state.history,week=thisWeek(),scores=h.filter(s=>Number.isFinite(s.before)&&Number.isFinite(s.after)),recent=scores.slice(-10),delta=recent.length?recent.reduce((sum,s)=>sum+s.before-s.after,0)/recent.length:null;
 app.innerHTML=`<span class="eyebrow">Consistency first</span><h1>Your practice, over time.</h1><div class="grid2"><div class="card"><div class="metric">${week.length} / 5</div><small>Sessions this week</small></div><div class="card"><div class="metric">${h.length}</div><small>Total sessions</small></div></div><div class="card"><h2>Stiffness</h2>${recent.length?`<p>Recent average change: <strong>${delta>0?delta.toFixed(1)+' points less stiff':delta<0?(-delta).toFixed(1)+' points more stiff':'unchanged'}</strong> immediately after a workout.</p><div class="trend" role="img" aria-label="Stiffness after each of your last ${recent.length} scored sessions">${recent.map(s=>`<div style="height:${Math.max(4,s.after*6)}px" title="${s.date}: ${s.after}/10 after"></div>`).join('')}</div><small>${recent.length} scored sessions. Immediate relief is different from a long-term trend.</small>`:'<p class="muted empty">Record stiffness before and after a few sessions to see your own pattern.</p>'}</div>
 ${wellnessProgress()}<div class="card"><h2>Exercise progress</h2><label for="history-variant">Exercise variation</label><select id="history-variant">${Object.entries(M.variants).map(([id,v])=>`<option value="${id}">${v.name}</option>`).join('')}</select><div id="exercise-history"></div></div><div class="card"><h2>Session history</h2>${h.length?h.slice(-20).reverse().map(s=>`<details class="record"><summary>${s.date} · ${s.letter}${s.short?' · shortened':''}</summary><p>${escape(s.peloton)} · ${s.logs.length} exercises<br>Stiffness: ${s.before??'—'} → ${s.after??'—'}<br>Feeling before: ${s.checkin?.feel??'—'}/5${s.checkin?.reasons?.length?' · '+s.checkin.reasons.map(escape).join(', '):''}<br>Right ankle: ${escape(s.ankle||'—')} · Back: ${escape(s.back||'—')}</p>${s.logs.map(l=>`<p><strong>${M.variants[l.variant].name}</strong><br>${setSummary(l)}<br><small>${escape(l.effort)}${l.pain?' · symptoms flagged':''}</small></p>`).join('')}</details>`).join(''):'<p class="muted empty">Your completed sessions will appear here.</p>'}</div>`;
 const select=$('#history-variant');const ids=h.flatMap(s=>s.logs.map(l=>l.variant));if(ids.length)select.value=ids.at(-1);select.onchange=()=>drawHistory(select.value);drawHistory(select.value);
}
function setSummary(l){const v=M.variants[l.variant];return l.sets.map(s=>`${v.body?'':v.band?escape(l.band)+' band · ':`${s.load+s.addon} lb${v.cable?` (${s.load} stack + ${s.addon} add-on)`:''} · `}${s.reps} ${v.kind==='seconds'?'sec':'reps'}${v.side?' / side':''}`).join('<br>');}
function drawHistory(id){const logs=M.lastLogs(state.history,id),v=M.variants[id],s=M.suggest(state.history,id);$('#exercise-history').innerHTML=`<p class="suggestion">Next time: ${escape(s.reason)}</p>${logs.length?`<small>${v.unit}</small>${logs.slice(-8).reverse().map(l=>`<div class="record"><span class="tag">${escape(l.date)}</span><strong>${setSummary(l)}</strong><br><small>${escape(l.effort)}${l.pain?' · symptoms flagged':''}</small></div>`).join('')}`:'<p class="muted">No records for this variation yet.</p>'}`;}
$('#backup').onclick=()=>{modal(`<h2>Your records</h2><p>Saved in this browser on this device. They do not automatically sync to your phone or the previous app.</p><p>Download a backup before changing devices or clearing browser data.</p><button id="export" class="primary">Download backup</button><label for="import">Restore a Mobility First backup</label><input id="import" type="file" accept="application/json,.json"><small>Restore replaces this version’s records after confirmation.</small><p><a href="https://everpropainting.github.io/mobility-first/previous.html">Open the previous app and its records</a></p><small>Use the same phone and browser where you used the previous app. Its records have not been imported into this rebuild.</small>${loadProblem?'<button id="export-raw" class="secondary" style="margin-top:16px">Download unreadable saved data</button>':''}`);
 $('#export').onclick=()=>download(JSON.stringify(state,null,2),`mobility-first-${M.localDate()}.json`);
 if($('#export-raw'))$('#export-raw').onclick=()=>download(localStorage.getItem(KEY)||'','mobility-first-recovery.txt');
 $('#import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error('Backup is too large.');const data=M.validate(JSON.parse(await file.text()));if(confirm(`Restore ${data.history.length} sessions? This replaces your current records; download a backup first.`)){const old=state;state=data;if(!persist()){state=old;return;}loadProblem=false;editing=null;form=null;$('#modal').close();render();toast('Backup restored');}}catch(error){toast(error.message||'Could not read that backup.');}};
};
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
setInterval(()=>{const el=$('#elapsed');if(el)el.textContent=elapsed()+' min since starting';const sleeping=$('#sleep-elapsed');if(sleeping&&state.sleepActive)sleeping.textContent=sleepDuration(Math.max(0,(Date.now()-new Date(state.sleepActive.start))/3600000));},30000);
render();


</script></body></html>
