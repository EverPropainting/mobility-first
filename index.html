 /* Old C order (v1 + first preview build): 0 sideways,1 press,2 shoulders,3 rotate,4 ankle[,5 latraise,6 core].
    New C order: 0 sideways,1 press,2 shoulders,3 latraise,4 rotate,5 ankle,6 core.

 function remapCSlotChoices(choices){
  const out={...(choices||{})};
  const lat=new Set(['latraise_db','latraise_cable','latraise_band']);
  const rot=new Set(['rotate','bandrotate']);
  const ank=new Set(['seatedcalf','calf','calf_smith']);

  if(c3&&lat.has(c3))return out;
  if(c4&&rot.has(c4)&&c5&&ank.has(c5))return out;
  if(c4&&rot.has(c4)&&!(c3&&rot.has(c3))&&!(c4&&ank.has(c4)))return out;

  if(c3&&rot.has(c3))out.C4=c3;
  if(c4&&ank.has(c4))out.C5=c4;
  if(c5&&lat.has(c5))out.C3=c5;

   }

  }

 }
 function validate(data){
  if(!data||![1,2].includes(data.version)||!DAY.includes(data.next)||!Array.isArray(data.history)||data.history.length>20000)throw Error('This is not a valid Mobility First backup.');
  const effortOk=e=>['easy','good','hard','right'].includes(e);

   if(!DAY.includes(s.letter)||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||!Array.isArray(s.logs)||s.logs.length>8)throw Error('Invalid session in backup.');
   for(const score of [s.before,s.after])if(score!=null&&(!Number.isFinite(score)||score<0||score>10))throw Error('Invalid stiffness score.');
   for(const l of s.logs){
    if(!variants[l.variant]||!Array.isArray(l.sets)||!l.sets.length||l.sets.length>3)throw Error('Invalid exercise in backup.');
    if(l.effort!=null&&!effortOk(l.effort))throw Error('Invalid effort in backup.');

   if(slot&&!slot.ids.includes(id)&&!variants[id])throw Error('Invalid exercise choice in backup.');
   if(!variants[id])throw Error('Invalid exercise choice in backup.');

   if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!entry)throw Error('Invalid daily check-in.');

<script>
'use strict';
function sleepDuration(hours){const minutes=Math.round(hours*60);return `${Math.floor(minutes/60)}h ${String(minutes%60).padStart(2,'0')}m`;}
function dailyCard(date=M.localDate()){

}
function bindDaily(date=M.localDate()){

function sleepEditor(mode,id){

let dailyDate;

function sparkline(records,label,unit){

function wellnessProgress(){

<script>
'use strict';
const M=window.Mobility, KEY='mobility_first_v2', $=s=>document.querySelector(s), app=$('#app');

let state=M.blank(),view='today',editing=null,form=null,loadProblem=false,lastBackupKey=null;
(function boot(){

  const raw=localStorage.getItem(KEY);

  const parsed=JSON.parse(raw);

   const stamp=new Date().toISOString().replace(/[:.]/g,'-');
   lastBackupKey=`mobility_first_v2_backup_v1_${stamp}`;
   try{localStorage.setItem(lastBackupKey, raw);}catch(e){/* still migrate; Backup UI remains */}
   const migrated=M.migrate(parsed);
   M.validate(migrated);
   state=migrated;

   const migrated=M.migrate(parsed);
   M.validate(migrated);
   state={...M.blank(),...migrated};
   if(parsed.version!==2)localStorage.setItem(KEY, JSON.stringify(state));
  }
 }catch(e){loadProblem=true;}

 };
}
function renderPlan(){app.innerHTML=`<span class="eyebrow">A repeatable practice</span><h1>Strength with movement.</h1><p class="muted">You pick A / B / C. Mains 3 sets · ankle finish 1 · arms/side-delts 2 · short core. Each option keeps its own history.</p>${M.DAY.map(letter=>`<section class="card session"><div class="row"><h2>${M.sessions[letter].title}</h2><span class="letter">${letter}</span></div>${slots(letter).map(s=>`<div class="record"><label for="plan-${letter}-${s.index}">${s.name}</label><select id="plan-${letter}-${s.index}" data-letter="${letter}" data-slot="${s.index}">${choiceOptions(letter,s.index,s.variant)}</select><small>${M.variants[s.variant].range.join('–')} ${M.variants[s.variant].kind==='seconds'?'seconds':'reps'}${M.variants[s.variant].side?' per side':''} · ${setLabel(s.sets)}</small><p>${M.variants[s.variant].cue}</p></div>`).join('')}</section>`).join('')}<div class="card"><h2>Progress at your pace</h2><p>Begin with light loads. First improve control and comfortable range, then reps, then resistance. No automatic load suggestions.</p><p>Overhead options are seated or kneeling for your ceiling. Bosu balance options are optional. The ankle finish always works both sides.</p></div>`;app.querySelectorAll('[data-letter]').forEach(s=>s.onchange=()=>{state.choices[s.dataset.letter+s.dataset.slot]=s.value;persist();render();});}
function renderProgress(){
 const h=state.history,week=thisWeek(),scores=h.filter(s=>Number.isFinite(s.before)&&Number.isFinite(s.after)),recent=scores.slice(-10),delta=recent.length?recent.reduce((sum,s)=>sum+s.before-s.after,0)/recent.length:null;
 app.innerHTML=`<span class="eyebrow">Consistency first</span><h1>Your practice, over time.</h1><div class="grid2"><div class="card"><div class="metric">${week.length} / 5</div><small>Sessions this week</small></div><div class="card"><div class="metric">${h.length}</div><small>Total sessions</small></div></div><div class="card"><h2>Stiffness</h2>${recent.length?`<p>Recent average change: <strong>${delta>0?delta.toFixed(1)+' points less stiff':delta<0?(-delta).toFixed(1)+' points more stiff':'unchanged'}</strong> immediately after a workout.</p><div class="trend" role="img" aria-label="Stiffness after each of your last ${recent.length} scored sessions">${recent.map(s=>`<div style="height:${Math.max(4,s.after*6)}px" title="${s.date}: ${s.after}/10 after"></div>`).join('')}</div><small>${recent.length} scored sessions. Immediate relief is different from a long-term trend.</small>`:'<p class="muted empty">Record stiffness before and after a few sessions to see your own pattern.</p>'}</div>
 ${wellnessProgress()}<div class="card"><h2>Exercise progress</h2><label for="history-variant">Exercise variation</label><select id="history-variant">${Object.entries(M.variants).map(([id,v])=>`<option value="${id}">${v.name}</option>`).join('')}</select><div id="exercise-history"></div></div><div class="card"><h2>Session history</h2>${h.length?h.slice(-20).reverse().map(s=>`<details class="record"><summary>${s.date} · ${s.letter}${s.short?' · shortened':''}</summary><p>${escape(s.peloton)} · ${s.logs.length} exercises<br>Stiffness: ${s.before??'—'} → ${s.after??'—'}<br>Feeling before: ${s.checkin?.feel??'—'}/5${s.checkin?.reasons?.length?' · '+s.checkin.reasons.map(escape).join(', '):''}<br>Right ankle: ${escape(s.ankle||'—')} · Back: ${escape(s.back||'—')}</p>${s.logs.map(l=>`<p><strong>${M.variants[l.variant]?M.variants[l.variant].name:l.variant}</strong><br>${setSummary(l)}<br><small>${escape(l.effort)}${l.pain?' · symptoms flagged':''}</small></p>`).join('')}</details>`).join(''):'<p class="muted empty">Your completed sessions will appear here.</p>'}</div>`;
 const select=$('#history-variant');const ids=h.flatMap(s=>s.logs.map(l=>l.variant));if(ids.length)select.value=ids.at(-1);select.onchange=()=>drawHistory(select.value);drawHistory(select.value);
}
function setSummary(l){const v=M.variants[l.variant];if(!v)return escape(JSON.stringify(l.sets));return l.sets.map(s=>`${v.body?'':v.band?escape(l.band)+' band · ':`${s.load+s.addon} lb${v.cable?` (${s.load} stack + ${s.addon} add-on)`:''} · `}${s.reps} ${v.kind==='seconds'?'sec':'reps'}${v.side?' / side':''}${s.feel?' · '+s.feel:''}`).join('<br>');}
function drawHistory(id){const logs=M.lastLogs(state.history,id),v=M.variants[id];$('#exercise-history').innerHTML=`<p class="suggestion">Last time only — no suggested next weight.</p>${logs.length?`<small>${v.unit}</small>${logs.slice(-8).reverse().map(l=>`<div class="record"><span class="tag">${escape(l.date)}</span><strong>${setSummary(l)}</strong><br><small>${escape(l.effort)}${l.pain?' · symptoms flagged':''}</small></div>`).join('')}`:'<p class="muted">No records for this variation yet.</p>'}`;}
$('#backup').onclick=()=>{modal(`<h2>Your records</h2><p>Saved in this browser on this device. They do not automatically sync to your phone or the previous app.</p><p><strong>Owner step before any production upgrade:</strong> on your iPhone Safari open the live app → Backup → Download backup. That device backup is not done from this preview.</p>${lastBackupKey?`<p class="notice">This browser also has a pre-migration copy: <code>${escape(lastBackupKey)}</code></p>`:''}<button id="export" class="primary">Download backup</button><label for="import">Restore a Mobility First backup</label><input id="import" type="file" accept="application/json,.json"><small>Restore replaces this version’s records after confirmation. v1 backups are migrated additively to v2.</small><p><a href="previous.html">Open the previous app and its records</a></p><small>Use the same phone and browser where you used the previous app. Its records have not been imported into this rebuild.</small>${loadProblem?'<button id="export-raw" class="secondary" style="margin-top:16px">Download unreadable saved data</button>':''}`);
 $('#export').onclick=()=>download(JSON.stringify(state,null,2),`mobility-first-${M.localDate()}.json`);
 if($('#export-raw'))$('#export-raw').onclick=()=>download(localStorage.getItem(KEY)||'','mobility-first-recovery.txt');
 $('#import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error('Backup is too large.');let data=JSON.parse(await file.text());if(data.version===1){const stamp=new Date().toISOString().replace(/[:.]/g,'-');try{localStorage.setItem(`mobility_first_v2_backup_v1_${stamp}`,JSON.stringify(data));}catch(_){}data=M.migrate(data);}data=M.validate(data);if(confirm(`Restore ${data.history.length} sessions? This replaces your current records; download a backup first.`)){const old=state;state=data;if(!persist()){state=old;return;}loadProblem=false;editing=null;form=null;$('#modal').close();render();toast('Backup restored');}}catch(error){toast(error.message||'Could not read that backup.');}};
};
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
setInterval(()=>{const el=$('#elapsed');if(el)el.textContent=elapsed()+' min since starting';const sleeping=$('#sleep-elapsed');if(sleeping&&state.sleepActive)sleeping.textContent=sleepDuration(Math.max(0,(Date.now()-new Date(state.sleepActive.start))/3600000));},30000);
render();


</script></body></html>
